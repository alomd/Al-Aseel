<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae084" />
      <stop offset="35%" stop-color="#dfb743" />
      <stop offset="70%" stop-color="#c59b27" />
      <stop offset="100%" stop-color="#8a6713" />
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1710" />
      <stop offset="100%" stop-color="#0a0806" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Shield / Circle -->
  <circle cx="64" cy="64" r="61" fill="url(#darkBg)" stroke="url(#goldGrad)" stroke-width="4.5" />
  <circle cx="64" cy="64" r="54" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.75"/>
  
  <!-- Golden Crown for Royal Confectionery -->
  <path d="M 45 36 L 52 44 L 64 31 L 76 44 L 83 36 L 79 49 L 49 49 Z" fill="url(#goldGrad)" filter="url(#goldGlow)"/>
  <circle cx="45" cy="34" r="2.5" fill="#fff" />
  <circle cx="64" cy="29" r="3" fill="#fff" />
  <circle cx="83" cy="34" r="2.5" fill="#fff" />

  <!-- Arabic Initial Calligraphy "أ" (الأصيل) with golden gradient -->
  <!-- Hamza -->
  <path d="M 61 54 C 61 51, 67 50, 69 52 C 71 54, 70 56, 67 57.5 C 64 59, 62 61, 66 61.5 L 72 61.5 L 72 64 L 60 64 C 60 62, 61 59.5, 64 58 C 66 57, 67 55.5, 65 54.5 C 64 53.5, 62 53.5, 61 54 Z" fill="url(#goldGrad)" filter="url(#goldGlow)" />
  
  <!-- Alif Shaft -->
  <path d="M 61 68 C 61 66, 67 66, 67 68 L 67 98 C 67 101, 61 101, 61 98 Z" fill="url(#goldGrad)" filter="url(#goldGlow)"/>

  <!-- Decorative Golden Accent Flourishes -->
  <polygon points="33,64 37,59 41,64 37,69" fill="url(#goldGrad)" opacity="0.85"/>
  <polygon points="95,64 91,59 87,64 91,69" fill="url(#goldGrad)" opacity="0.85"/>
  
  <!-- Subtle wheat / palm leaf at bottom -->
  <path d="M 52 104 Q 64 100 76 104 Q 64 108 52 104 Z" fill="url(#goldGrad)" opacity="0.9"/>
</svg>
